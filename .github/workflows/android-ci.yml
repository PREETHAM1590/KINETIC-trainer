name: Android Trainer App CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Prepare Firebase config path
        shell: bash
        run: |
          mkdir -p .ci
          if [ -n "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > .ci/google-services.json
            echo "GOOGLE_SERVICES_JSON_PATH=$PWD/.ci/google-services.json" >> "$GITHUB_ENV"
            echo "Using injected Firebase config from secret."
          else
            echo "No Firebase secret found; debug/test tasks will use template fallback."
          fi
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Prepare Firebase config path
        shell: bash
        run: |
          mkdir -p .ci
          if [ -n "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > .ci/google-services.json
            echo "GOOGLE_SERVICES_JSON_PATH=$PWD/.ci/google-services.json" >> "$GITHUB_ENV"
            echo "Using injected Firebase config from secret."
          else
            echo "No Firebase secret found; release build is expected to fail fast with a clear message."
          fi
      - name: Build debug and release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
